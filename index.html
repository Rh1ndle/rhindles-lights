<body>
<div id="era"><div class="lbls"><span>Modern GPU</span><b id="eraTxt">ERA</b><span>Voodoo 1 (1996)</span></div>

<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {ShaderPass} from 'three/addons/postprocessing/ShaderPass.js';

const Q = new URLSearchParams(location.search);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rng = mulberry32(parseInt(Q.get('seed')||String((Math.random()*1e9)|0)));
const R = (a=0,b=1)=>a+(b-a)*rng();

// ---------------- settings (defaults match the original control panel) ----------------
const S = {spinners:6, meteors:4, worms:5, trailers:6, tubifex:12, size:50, debris:100, time:225, nebula:100, camDist:+(Q.get('dist')||10), flybys:Q.get('ships')!=='0', shipTos:true, shipTng:true, bloom:+(Q.get('bloom')||140), shipDist:+(Q.get('sd')||100), shipSpeed:400, sparkles:81, haze:Q.get('haze')!=='0', flyEvery:45,
           camera: Q.get('cam')==='follow'?'follow':'classic', era: parseFloat(Q.get('era')||'0')};

// ---------------- renderer ----------------
const renderer = new THREE.WebGLRenderer({antialias:false, powerPreference:'high-performance', preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000,1);
document.body.prepend(renderer.domElement);

renderer.debug.onShaderError=(gl,prog,vs,fs)=>{
  const log=(gl.getShaderInfoLog(fs)||gl.getShaderInfoLog(vs)||gl.getProgramInfoLog(prog)||'').split('\n').slice(0,4).join(' | ');
  console.error('SHADER ERROR',log);
  let b=document.getElementById('shErr');if(!b){b=document.createElement('div');b.id='shErr';b.style.cssText='position:fixed;top:0;left:0;right:0;z-index:99;background:#7a0000;color:#fff;font:12px monospace;padding:6px 10px;white-space:pre-wrap';document.body.appendChild(b)}
  b.textContent='Shader failed to compile on this GPU: '+log;
};
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.05, 600);
camera.position.set(0,0,12);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight), 1.0, 0.65, 0.12);
composer.addPass(bloom);

const finalPass = new ShaderPass({
  uniforms:{tDiffuse:{value:null}, uEra:{value:0}, uLowH:{value:100000}, uRes:{value:new THREE.Vector2(innerWidth,innerHeight)}},
  vertexShader:`varying vec2 vUv; void main(){vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`
    uniform sampler2D tDiffuse; uniform float uEra; uniform float uLowH; uniform vec2 uRes; varying vec2 vUv;
    float bayer4(vec2 p){
      vec2 q=mod(floor(p),4.);
      float x0=mod(q.x,2.), x1=floor(q.x/2.), y0=mod(q.y,2.), y1=floor(q.y/2.);
      return (8.*abs(x0-y0)+4.*y0+2.*abs(x1-y1)+y1)/16.;
    }
    void main(){
      float e=uEra;
      float lowH=min(uLowH,uRes.y);
      vec2 lowRes=vec2(floor(lowH*uRes.x/uRes.y),lowH);
      vec2 uv=(floor(vUv*lowRes)+.5)/lowRes;
      vec3 c=texture2D(tDiffuse,uv).rgb;
      c=1.-exp(-c*.95);
      c=pow(c,vec3(1./1.9));
      float d=bayer4(vUv*lowRes)-.5;
      float dp=e>.01?1.:0.;
      vec3 lv=dp>.5?vec3(31.,63.,31.):vec3(255.);
      c=(floor(c*lv+.5+d*dp*1.6))/lv;
      gl_FragColor=vec4(c,1.);
    }`
});
composer.addPass(finalPass);

// ---------------- helpers ----------------
const V3 = THREE.Vector3;
function hsl2rgb(h,s,l){h=((h%1)+1)%1;const a=s*Math.min(l,1-l);const f=n=>{const k=(n+h*12)%12;return l-a*Math.max(-1,Math.min(k-3,9-k,1))};return [f(0),f(8),f(4)]}
const HUES=[0.95,0.98,0.03,0.08,0.15,0.33,0.4,0.5,0.58,0.72,0.8,0.9];

// ---------------- Ribbon (camera-facing glowing strip) ----------------
const ribbonVS=`attribute vec2 aUv; attribute vec3 aCol; attribute float aAlpha;
varying vec2 vUv; varying vec3 vCol; varying float vA;
void main(){vUv=aUv;vCol=aCol;vA=aAlpha;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`;
const ribbonFS=`varying vec2 vUv; varying vec3 vCol; varying float vA; uniform float uBead; uniform float uCore; uniform float uDash; uniform float uWhite;
void main(){
  float d=abs(vUv.y);
  float solid=1.-smoothstep(.30,.60,d);
  float halo=exp(-d*d*3.4)*.40;
  float core=exp(-d*d*uCore);
  float shade=.78+.22*(1.-d*1.6);
  float bead=uBead>0.?(0.55+0.45*sin(vUv.x*uBead)):1.;
  float dash=1.;
  if(uDash>0.){float f=fract(vUv.x*uDash);dash=smoothstep(.05,.2,f)*(1.-smoothstep(.62,.8,f));}
  vec3 c=(vCol*(solid*shade*1.05+halo)+vec3(1.)*core*.95*uWhite)*bead*dash;
  float a=vA*(1.-smoothstep(.85,1.,d));
  gl_FragColor=vec4(c*a,1.);
}`;
class Ribbon{
  constructor(n,uBead=0,uCore=14,uDash=0,uWhite=1){
    this.n=n;
    const g=this.geo=new THREE.BufferGeometry();
    this.pos=new Float32Array(n*6);this.col=new Float32Array(n*6);this.alpha=new Float32Array(n*2);
    const uv=new Float32Array(n*4);
    for(let i=0;i<n;i++){const u=i/(n-1);uv.set([u,-1,u,1],i*4)}
    const idx=[];for(let i=0;i<n-1;i++){const a=2*i,b=a+1,c=a+2,d=a+3;idx.push(a,b,c,b,d,c)}
    g.setAttribute('position',new THREE.BufferAttribute(this.pos,3).setUsage(THREE.DynamicDrawUsage));
    g.setAttribute('aUv',new THREE.BufferAttribute(uv,2));
    g.setAttribute('aCol',new THREE.BufferAttribute(this.col,3).setUsage(THREE.DynamicDrawUsage));
    g.setAttribute('aAlpha',new THREE.BufferAttribute(this.alpha,1).setUsage(THREE.DynamicDrawUsage));
    g.setIndex(idx);
    this.mat=new THREE.ShaderMaterial({vertexShader:ribbonVS,fragmentShader:ribbonFS,transparent:true,depthWrite:false,depthTest:false,
      blending:THREE.CustomBlending,blendSrc:THREE.OneFactor,blendDst:THREE.OneFactor,blendEquation:THREE.AddEquation,side:THREE.DoubleSide,
      uniforms:{uBead:{value:uBead},uCore:{value:uCore},uDash:{value:uDash},uWhite:{value:uWhite}}});
    this.mesh=new THREE.Mesh(g,this.mat);this.mesh.frustumCulled=false;
  }
  update(pts,camPos,o){
    const m=Math.min(pts.length,this.n);
    if(m<3){this.mesh.visible=false;return}
    this.mesh.visible=true;
    const tan=RB.tan,toCam=RB.toCam,side=RB.side,col=RB.col;
    for(let i=0;i<m;i++){
      const p=pts[i],a=pts[Math.max(i-1,0)],b=pts[Math.min(i+1,m-1)];
      tan.subVectors(a,b);toCam.subVectors(camPos,p);
      side.crossVectors(tan,toCam);const l=side.length();
      if(l<1e-7)side.set(0,1,0);else side.multiplyScalar(1/l);
      const u=i/(this.n-1);
      const head=Math.min(1,(u+0.015)*22);
      const w=o.width*1.7*Math.pow(1-u,o.taperPow||0.75)*head;
      let off=0;
      if(o.amp){off=o.amp*(Math.sin(u*o.freq+o.phase+o.time*o.wob)+0.45*Math.sin(u*o.freq*2.7+o.phase*1.7-o.time*o.wob*1.3))*Math.min(1,u*9)}
      const cx=p.x+side.x*off,cy=p.y+side.y*off,cz=p.z+side.z*off;
      const j=i*6;
      this.pos[j]=cx-side.x*w;this.pos[j+1]=cy-side.y*w;this.pos[j+2]=cz-side.z*w;
      this.pos[j+3]=cx+side.x*w;this.pos[j+4]=cy+side.y*w;this.pos[j+5]=cz+side.z*w;
      o.color(u,col);
      this.col.set(col,j);this.col.set(col,j+3);
      const al=Math.pow(1-u,o.alphaPow||1.15)*(o.bright||1);
      this.alpha[i*2]=al;this.alpha[i*2+1]=al;
    }
    this.geo.attributes.position.needsUpdate=true;this.geo.attributes.aCol.needsUpdate=true;this.geo.attributes.aAlpha.needsUpdate=true;
    this.geo.setDrawRange(0,(m-1)*6);
  }
}
const RB={tan:new V3(),toCam:new V3(),side:new V3(),col:[0,0,0]};

// ---------------- Heads (billboard quads: orbs, rosettes, nebula) ----------------
const headVS=`uniform float uRoll; attribute vec2 aCorner; attribute float aSize; attribute vec3 aColor; attribute float aType; attribute float aRot;
varying vec2 vC; varying vec3 vCol; varying float vType; varying float vRot;
void main(){
  vec4 mv=modelViewMatrix*vec4(position,1.);
  vec2 cc=aCorner;
  if((aType<3.5&&aType>1.5)||aType>4.5){float ca=cos(uRoll),sa=sin(uRoll);cc=vec2(ca*cc.x-sa*cc.y,sa*cc.x+ca*cc.y);}
  mv.xy+=cc*aSize;
  gl_Position=projectionMatrix*mv;
  vC=aCorner;vCol=aColor;vType=aType;vRot=aRot;
}`;
const FS_PRE=`varying vec2 vC; varying vec3 vCol; varying float vType; varying float vRot;
float hh(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float nn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hh(i),hh(i+vec2(1.,0.)),f.x),mix(hh(i+vec2(0.,1.)),hh(i+vec2(1.,1.)),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int k=0;k<5;k++){v+=a*nn(p);p=p*2.03+vec2(17.,9.);a*=.5;}return v;}
`;
const FS_OPEN=`void main(){
  float t=vType;
  float r=length(vC);
  if(r>1.&&(t<3.5||t>4.5)) discard;
  vec3 c=vec3(0.);
`;
const FS_CLOSE=`
  if(t<3.5&&t>2.5) c*=smoothstep(1.,.72,r);
  if(t<.5) c*=smoothstep(1.,.72,r);
  gl_FragColor=vec4(c,1.);
}`;
// A: creature heads, comet bodies, sparkle stars  (cheap, no noise)
const FS_A=FS_PRE+FS_OPEN+`
  if(t<.5){
    float colored=vRot>.5?1.:0.;
    float disc=1.-smoothstep(mix(.24,.40,colored),mix(.32,.47,colored),r);
    float core=exp(-r*r*mix(60.,140.,colored));
    float halo=exp(-r*r*8.5)*mix(.6,.45,colored);
    c=vCol*(disc*mix(1.05,1.25,colored)+halo)+vec3(1.)*core*mix(1.15,0.,colored);
    if(colored>.5){float pk=1.-smoothstep(.0,.30,r);c+=vec3(1.,.12,.55)*(pk*pk*1.15)+vec3(1.,.7,.9)*exp(-r*r*140.)*.7;}
  } else if(t<1.5){
    c=vCol*exp(-r*r*9.);
  } else if(t<3.5){
    vec2 q=vC/.36; float rr=length(q);
    float halo=exp(-r*r*8.)*.5 + (smoothstep(.62,.7,r)*(1.-smoothstep(.7,.8,r)))*.10;
    c=vCol*halo;
    if(rr<1.){
      vec3 n=vec3(q,sqrt(max(0.,1.-rr*rr)));
      vec3 L=normalize(vec3(-.45,.55,.7));
      float df=max(dot(n,L),0.);
      float rim=mix(.42,1.,n.z);
      vec3 body=vCol*(.30+.85*df)*rim + vec3(1.,1.,.85)*pow(df,22.)*1.0;
      float m=1.-smoothstep(.94,1.,rr);
      c=mix(c,body*1.15,m);
    }
  } else {
    float ax=abs(vC.x),ay=abs(vC.y);
    float lv=max(1.-ay,0.),lh=max(1.-ax/.6,0.);
    float vv=pow(lv,2.2)*exp(-ax*ax/(.00035+.0032*lv*lv));
    float hh2=pow(lh,2.2)*exp(-ay*ay/(.00035+.0032*lh*lh));
    float core=exp(-r*r*520.)*1.5+exp(-r*r*55.)*.28;
    c=vCol*(vv*.95+hh2*.8+core*.55)+vec3(1.)*core*.55;
  }
`+FS_CLOSE;
// B: classic nebula cloud + the four small galaxies
const FS_B=FS_PRE+FS_OPEN+`
  if(t<2.5){
    float m=fbm(vC*2.3+vRot);
    float m2=fbm(vC*5.1-vRot*1.7);
    float fall=1.-smoothstep(.0,1.,r);
    float dens=fall*fall*smoothstep(.28,.85,m*.75+m2*.4);
    c=vCol*dens*1.1;
  } else if(t<5.5){
    float sd=fract(vRot*.137);
    float ca=cos(vRot),sa=sin(vRot);
    vec2 p=mat2(ca,-sa,sa,ca)*vC; p.y*=1.8+sd*1.2;
    float rr=length(p);
    float a=atan(p.y,p.x);
    float armsN=sd<.5?2.:3.;
    float arms=.5+.5*cos(armsN*a-(5.+sd*7.)*log(rr+.03));
    float disk=exp(-rr*rr*6.5);
    float tex=.65+.7*fbm(p*6.);
    c=vCol*disk*(.22+.9*arms*arms)*tex*.9;
    c+=vec3(1.,.93,.78)*exp(-rr*rr*90.)*.75;
    c*=1.-smoothstep(.55,1.,rr);
  } else if(t<6.5){
    float ca=cos(vRot),sa=sin(vRot);
    vec2 p=mat2(ca,-sa,sa,ca)*vC; p.y*=1.6;
    float rr=length(p);
    float tex=.75+.5*fbm(p*3.5+vRot);
    c=vCol*(exp(-rr*rr*7.)*.75+exp(-rr*rr*45.)*.6)*tex;
    c*=1.-smoothstep(.6,1.,rr);
  } else if(t<7.5){
    float ca=cos(vRot),sa=sin(vRot);
    vec2 p=mat2(ca,-sa,sa,ca)*vC; p.y*=5.;
    float lum=exp(-p.x*p.x*4.2)*(exp(-p.y*p.y*8.)*.85-exp(-p.y*p.y*140.)*.55);
    lum+=exp(-(p.x*p.x*38.+p.y*p.y*2.5))*.7;
    float tex=.8+.4*fbm(p*5.);
    c=vCol*max(lum,0.)*tex;
    c*=1.-smoothstep(.55,1.,length(vC));
  } else {
    float ca=cos(vRot),sa=sin(vRot);
    vec2 p=mat2(ca,-sa,sa,ca)*vC; p.y*=1.5;
    float rr=length(p);
    float a=atan(p.y,p.x);
    float bar=exp(-(p.x*p.x*18.+p.y*p.y*320.));
    float arms=.5+.5*cos(2.*a-4.2*log(rr+.05)+1.2);
    float tex=.7+.6*fbm(p*5.5);
    c=vCol*(exp(-rr*rr*7.)*(.15+.75*arms*arms*smoothstep(.12,.4,rr))*tex+bar*.8);
    c+=vec3(1.,.9,.7)*exp(-rr*rr*110.)*.6;
    c*=1.-smoothstep(.55,1.,rr);
  }
`+FS_CLOSE;
// C: spacious wispy haze
const FS_C=FS_PRE+FS_OPEN+`
  float m=fbm(vC*1.7+vRot);
  float m2=fbm(vC*3.4-vRot*1.3+5.);
  float ridge=1.-abs(2.*nn(vC*4.2+vRot*.7+11.)-1.);
  float fall=1.-smoothstep(.0,1.,r);
  float dens=fall*fall*smoothstep(.22,.9,m*.8+m2*.35)*(.55+.9*ridge*ridge);
  c=vCol*dens*.95;
`+FS_CLOSE;
class Heads{
  constructor(max,fs){
    this.max=max;this.count=0;
    const g=this.geo=new THREE.BufferGeometry();
    this.p=new Float32Array(max*12);this.cr=new Float32Array(max*8);this.sz=new Float32Array(max*4);
    this.cl=new Float32Array(max*12);this.ty=new Float32Array(max*4);this.rt=new Float32Array(max*4);
    const corners=[-1,-1,1,-1,1,1,-1,1];
    for(let i=0;i<max;i++)this.cr.set(corners,i*8);
    const idx=[];for(let i=0;i<max;i++){const a=i*4;idx.push(a,a+1,a+2,a,a+2,a+3)}
    g.setIndex(idx);
    const dyn=(arr,n)=>new THREE.BufferAttribute(arr,n).setUsage(THREE.DynamicDrawUsage);
    g.setAttribute('position',dyn(this.p,3));g.setAttribute('aCorner',new THREE.BufferAttribute(this.cr,2));
    g.setAttribute('aSize',dyn(this.sz,1));g.setAttribute('aColor',dyn(this.cl,3));
    g.setAttribute('aType',dyn(this.ty,1));g.setAttribute('aRot',dyn(this.rt,1));
    this.mesh=new THREE.Mesh(g,new THREE.ShaderMaterial({uniforms:{uRoll:{value:0}},vertexShader:headVS,fragmentShader:fs,transparent:true,depthWrite:false,depthTest:false,
      blending:THREE.CustomBlending,blendSrc:THREE.OneFactor,blendDst:THREE.OneFactor,blendEquation:THREE.AddEquation,side:THREE.DoubleSide}));
    this.mesh.frustumCulled=false;
  }
  reset(){this.count=0}
  add(pos,size,col,type,rot=0){
    if(this.count>=this.max)return;const i=this.count++;
    for(let k=0;k<4;k++){
      this.p.set([pos.x,pos.y,pos.z],(i*4+k)*3);this.sz[i*4+k]=size;this.cl.set(col,(i*4+k)*3);this.ty[i*4+k]=type;this.rt[i*4+k]=rot;
    }
  }
  flush(){
    for(const k of ['position','aSize','aColor','aType','aRot'])this.geo.attributes[k].needsUpdate=true;
    this.geo.setDrawRange(0,this.count*6);
  }
}
const heads=new Heads(700,FS_A);scene.add(heads.mesh);
const headsB=new Heads(64,FS_B),headsC=new Heads(16,FS_C);
const allHeads=[heads,headsB,headsC];
for(const h of[headsB,headsC])scene.add(h.mesh);
const headsFor=ty=>ty===2||(ty>4.5&&ty<8.5)?headsB:(ty>10.5?headsC:heads);

// ---------------- Stars (round dots) ----------------
let starMesh=null;
const starUniforms={uCam:{value:new V3()},uBox:{value:70},uPx:{value:1}};
function buildStars(){
  if(starMesh){scene.remove(starMesh);starMesh.geometry.dispose()}
  const n=Math.round(1200+S.debris*28);
  const pos=new Float32Array(n*3),br=new Float32Array(n),tint=new Float32Array(n*3);
  const tints=[[1,1,1],[1,1,1],[1,1,1],[.75,.85,1],[1,.95,.75],[.7,1,.9],[1,.8,.9]];

    this.f=[R(T.fmin,T.fmax),R(T.fmin,T.fmax),R(T.fmin,T.fmax)];this.ph=[R(0,6.28),R(0,6.28),R(0,6.28)];

  respawn(){

    tmp.set(R(-1,1),R(-1,1),R(-1,1)).multiplyScalar(WORLD_R*.35);

  }
  tick(dt,t){

    this.acc+=dt;let g=0;
    while(this.acc>=this.T.sample&&g++<4){this.acc-=this.T.sample;this.hist.unshift(this.pos.clone());if(this.hist.length>this.T.n)this.hist.pop()}

    } else if(k==='meteor'){
      const col=(u,o)=>{const c=hsl2rgb(.13-.12*u,1,.5+.2*(1-u));o[0]=c[0];o[1]=c[1];o[2]=c[2]};
      this.ribbons[0].update(pts,camPos,{width:.15*sz,color:col,taperPow:1.4,alphaPow:.9,bright:1.15});
      heads.add(this.pos,size*1.5,[1,.85,.5],0);
    } else if(k==='worm'){

      heads.add(this.pos,size*1.9,hsl2rgb(h+.05,1,.6),0);

      for(let i=0;i<2;i++)this.ribbons[i].update(pts,camPos,{width:.012*sz,amp:(.38+.25*i)*sz,freq:9+i*5,phase:this.ph[i],wob:1.6+i,time:t,color:orange,taperPow:.5,alphaPow:.6,bright:.5});

    this.axis=new V3(R(-1,1),R(-1,1),R(-1,1)).normalize();
    this.members=[];this.ribbons=[];this.acc=0;
    for(let i=0;i<n;i++){
      this.members.push({pos:this.pos.clone().add(new V3(R(-1,1),R(-1,1),R(-1,1)).multiplyScalar(1.4)),vel:new V3(R(-1,1),R(-1,1),R(-1,1)).multiplyScalar(1.2),
        hist:[],hue:R(.29,.31),ph:R(0,6.28),wf:R(.5,1.6)});

    for(const m of M){
      _a.subVectors(this.pos,m.pos);

      m.vel.addScaledVector(_a,dist>2.4?5*dt:1.2*dt);
      for(const o of M){if(o===m)continue;_c.subVectors(m.pos,o.pos);const l=_c.length();if(l<.7&&l>1e-4)m.vel.addScaledVector(_c,(.7-l)/l*7*dt)}
      const w=m.wf*4.2*dt;m.vel.x+=Math.sin(t*2.3*m.wf+m.ph)*w;m.vel.y+=Math.sin(t*1.9*m.wf+m.ph*1.9)*w;m.vel.z+=Math.sin(t*2.7*m.wf+m.ph*.7)*w;
      m.vel.multiplyScalar(Math.exp(-dt*.75));

  }
  render(t,camPos,sz){

const cam={pos:new V3(0,0,12),look:new V3(),up:new V3(0,1,0),target:null,timer:0,roll:0,
  drift:{pos:new V3(0,0,6),dir:new V3(0,0,-1),speed:.5,turn:.2,f:[.11,.17,.13],ph:[1,2,3],lim:.5}};
const _a=new V3(),_b=new V3(),_c=new V3(),_up=new V3(),_r=new V3();
function updateCamera(dt,t){
  if(window.__cam){camera.position.copy(window.__cam.p);camera.up.set(0,1,0);camera.lookAt(window.__cam.l);return}
  if(S.camera==='follow'){
    cam.timer-=dt;
    if(!cam.target||cam.timer<0){
      const pool=creatures.filter(c=>c.kind!=='meteor'&&c.kind!=='tubifex');
      const p=pool.length?pool:creatures;cam.target=p[(rng()*p.length)|0];cam.timer=R(16,30);
    }
    const c=cam.target;if(!c)return;
    cam.roll+=dt*(.1+.12*Math.sin(t*.13)+.05*Math.sin(t*.41));
    _r.crossVectors(c.dir,_a.set(0,1,0));if(_r.lengthSq()<1e-4)_r.set(1,0,0);_r.normalize();
    _up.crossVectors(_r,c.dir).normalize();
    _b.copy(_up).multiplyScalar(Math.cos(cam.roll)).addScaledVector(_r,Math.sin(cam.roll));
    const dist=4.5+2.5*Math.sin(t*.09);
    _a.copy(c.pos).addScaledVector(c.dir,-dist).addScaledVector(_b,1.1).addScaledVector(_r,Math.sin(t*.21)*2.2);
    cam.pos.lerp(_a,1-Math.exp(-dt*1.4));
    _c.copy(c.pos).addScaledVector(c.dir,3);
    cam.look.lerp(_c,1-Math.exp(-dt*2.2));
    cam.up.lerp(_b,1-Math.exp(-dt*1.5)).normalize();
  } else {
    const d=cam.drift;steer(d,dt,t);
    cam.pos.lerp(d.pos,1-Math.exp(-dt*3));
    _c.copy(d.pos).addScaledVector(d.dir,6);cam.look.lerp(_c,1-Math.exp(-dt*1.2));
    cam.roll+=dt*.03;_b.set(Math.sin(cam.roll),Math.cos(cam.roll),0);cam.up.lerp(_b,1-Math.exp(-dt*.8)).normalize();
  }
  camera.position.copy(cam.pos);camera.up.copy(cam.up);
  _a.subVectors(cam.look,cam.pos);if(_a.lengthSq()<1e-6)_a.set(0,0,-1);
  camera.lookAt(cam.pos.clone().add(_a));
  _a.normalize();camera.position.addScaledVector(_a,-S.camDist);
}

function applyEra(){

  const H0=innerHeight*renderer.getPixelRatio();

  const t=document.getElementById('eraTxt');

  const bk=S.bloom/100;bloom.strength=(.26*Math.pow(1-e,1.5)+.03*e)*bk;bloom.radius=(.45*(1-e)+.05*e)*(.75+.25*bk);bloom.threshold=.55*(1-e)+.7*e;
}

  const sdm=new THREE.Mesh(stg,hullMats({base:'#c1c5d0',cols:16,rows:26,winRows:[-.02,-.008,.008,.02],v0:.12,v1:.8,sp:11,seed:41}));sdm.rotation.x=Math.PI/2;sd.add(sdm);

  dish.rotation.x=Math.PI/2;dish.position.set(0,-.1,.4);inner.add(dish);
  const dglow=new THREE.Mesh(new THREE.SphereGeometry(.17,16,12),glowMat(0x8fd0ff,3));dglow.position.set(0,-.1,.5);inner.add(dglow);rg.pulseMat(dglow.material,2.6,.3);
  const hang=new THREE.Mesh(new THREE.PlaneGeometry(1.1,.42),new THREE.MeshBasicMaterial({map:cTex(256,96,g=>{g.fillStyle='#ffd9a0';g.fillRect(0,0,256,96);g.strokeStyle='#7c6a48';g.lineWidth=3;for(let i=1;i<6;i++){g.beginPath();g.moveTo(i*42,0);g.lineTo(i*42,96);g.stroke()}g.strokeRect(2,2,252,92)})}));
  hang.position.set(0,-.02,-4.42);hang.rotation.y=Math.PI;inner.add(hang);

    const cap=new THREE.Mesh(new THREE.CircleGeometry(.2,24),glowMat(0x7cc4ff,2.6));cap.position.z=-1.96;cap.rotation.y=Math.PI;N.add(cap);

// ---------------- fly-by control ----------------
const SHIPS={tos:makeTOS,tng:makeTNG},shipCache={};
let ship=null,shipTimer=8;
const T1=Math.tan(70*RAD/2),T2=Math.tan(SHIP_FOV*RAD/2),_s=new V3(),_d=new V3(),_w=new V3(),_u=new V3(),_x=new V3(),_m4=new THREE.Matrix4();
function spawnShip(kind){
  if(ship){shipScene.remove(ship);ship=null}
  const keys=kind?[kind]:[S.shipTos&&'tos',S.shipTng&&'tng'].filter(Boolean);
  if(!keys.length)return;
  const k=keys[(rng()*keys.length)|0];
  ship=shipCache[k]||(shipCache[k]=SHIPS[k]());
  const u=ship.userData;u.kind=k;u.pinned=false;u.t=0;
  camera.updateMatrixWorld();
  const fwd=new V3(0,0,-1).applyQuaternion(camera.quaternion),right=new V3(1,0,0).applyQuaternion(camera.quaternion),up=new V3(0,1,0).applyQuaternion(camera.quaternion);
  const dist=S.shipDist*R(.92,1.08),side=rng()<.5?-1:1;
  const t1=Math.tan(camera.fov*RAD/2),hf=Math.atan(t1*camera.aspect);
  u.E=dist*Math.tan(hf)*1.05+u.len*.6;
  u.P=camera.position.clone().addScaledVector(fwd,dist).addScaledVector(up,R(-.2,.22)*dist*t1);
  u.d=right.clone().multiplyScalar(side).addScaledVector(fwd,R(-.1,.1)).normalize();
  u.life=2*u.E/u.speed;u.tilt0=R(.26,.4);u.ph=R(0,6.28);
  shipScene.add(ship);ship.visible=false;
}
function orientShip(d,tilt,roll){
  const back=_w.set(0,0,1).applyQuaternion(camera.quaternion);back.addScaledVector(d,-back.dot(d)).normalize();
  const upv=_u.set(0,1,0).applyQuaternion(camera.quaternion);upv.addScaledVector(d,-upv.dot(d)).normalize();
  upv.multiplyScalar(Math.cos(tilt)).addScaledVector(back,Math.sin(tilt)).normalize();   // always "roof up", tipped slightly toward the viewer
  _x.crossVectors(upv,d).normalize();
  _m4.makeBasis(_x,upv,d);ship.quaternion.setFromRotationMatrix(_m4);ship.rotateZ(roll);
}
function shipLights(){
  const back=_w.set(0,0,1).applyQuaternion(camera.quaternion),right=_x.set(1,0,0).applyQuaternion(camera.quaternion),up=_u.set(0,1,0).applyQuaternion(camera.quaternion);
  const p=ship.position;
  shipKey.position.copy(p).addScaledVector(right,-60).addScaledVector(up,55).addScaledVector(back,40);
  shipFill.position.copy(p).addScaledVector(right,70).addScaledVector(up,-25).addScaledVector(back,30);
  shipRim.position.copy(p).addScaledVector(right,40).addScaledVector(up,35).addScaledVector(back,-90);
  for(const l of[shipKey,shipFill,shipRim]){l.target.position.copy(p);l.target.updateMatrixWorld()}
}
function animateShipBits(){
  const now=performance.now()/1000,u=ship.userData;
  for(const b of u.blink)b.m.visible=(((now+b.ph)%b.per)/b.per)<b.on;
  for(const p of u.pulse)p.mat.color.copy(p.base).multiplyScalar(1+p.amp*Math.sin((now+p.ph)*6.2832/p.per));
}
function updateShip(dt){
  shipCam.position.copy(camera.position);shipCam.quaternion.copy(camera.quaternion);
  if(shipCam.aspect!==camera.aspect){shipCam.aspect=camera.aspect;shipCam.updateProjectionMatrix()}
  shipCam.updateMatrixWorld();
  if(!ship){shipPass.enabled=false;if(S.flybys){shipTimer-=dt;if(shipTimer<=0){spawnShip();shipTimer=S.flyEvery*R(.7,1.4)}}return}
  const u=ship.userData;
  if(!u.pinned){
    if(!u.frozen)u.t+=dt*S.shipSpeed/100;
    if(u.t>u.life){shipScene.remove(ship);ship=null;shipPass.enabled=false;return}
    _s.copy(u.P).addScaledVector(u.d,-u.E+u.t*u.speed);
    _s.addScaledVector(_u.set(0,1,0).applyQuaternion(camera.quaternion),Math.sin(u.t*.35+u.ph)*.5);   // gentle bob
    const cs=_s.applyMatrix4(camera.matrixWorldInverse),zc=-cs.z;
    const nx=cs.x/(zc*T1*camera.aspect),ny=cs.y/(zc*T1);
    if(zc<4||Math.abs(nx)>3||Math.abs(ny)>3){ship.visible=false;shipPass.enabled=false;return}
    const zc2=zc*T1/T2;   // same on-screen size and position as the wide lens would give, but through a narrow lens
    ship.position.set(nx*T2*camera.aspect*zc2,ny*T2*zc2,-zc2).applyMatrix4(camera.matrixWorld);
    orientShip(_d.copy(u.d),u.tilt0+.05*Math.sin(u.t*.3+u.ph),.035*Math.sin(u.t*.45+u.ph));
    ship.visible=true;
  }
  shipPass.enabled=true;shipLights();animateShipBits();
}
// debug helper: park a ship in front of the camera and look at it from az/el
window.pinShip=(k,az=0,el=.3,dist=48)=>{spawnShip(k);const u=ship.userData;u.pinned=true;camera.updateMatrixWorld();
  const fwd=new V3(0,0,-1).applyQuaternion(camera.quaternion);ship.position.copy(camera.position).addScaledVector(fwd,dist);
  ship.quaternion.copy(camera.quaternion).multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(el,az,0,'YXZ')));
  ship.visible=true;shipPass.enabled=true;return k};


// ---------------- main loop ----------------
WORLD_R=worldFor(S.camDist);
buildStars();buildNebulas();rebuildCreatures();applyEra();resize();
let simT=0;const prevView=new THREE.Matrix4();
// warm up so trails already exist at first frame
for(let i=0;i<900;i++){simT+=1/30;for(const c of creatures)c.tick(1/30,simT);updateCamera(1/30,simT)}
camera.updateMatrixWorld();prevView.copy(camera.matrixWorldInverse);

let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  let dt=Math.min((now-last)/1000,.05);last=now;
  if(!(dt>0))return;
  idle+=dt;if(idle>4&&!uiHidden){ui.classList.add('hide');eraEl.classList.add('hide')}
  const sdt=dt*S.time/100;
  const steps=Math.max(1,Math.ceil(sdt/(1/45)));
  for(let s=0;s<steps;s++){const d=sdt/steps;simT+=d;for(const c of creatures)c.tick(d,simT)}
  updateCamera(S.camera==='classic'?dt*.16:sdt,simT);
  camera.updateMatrixWorld();updateShip(dt);
  starUniforms.uCam.value.copy(camera.position);starUniforms.uPx.value=renderer.getPixelRatio();
  for(const h of allHeads)h.reset();
  {const u=_a.set(0,1,0).transformDirection(camera.matrixWorldInverse);const roll=Math.atan2(-u.x,u.y);for(const h of allHeads)h.mesh.material.uniforms.uRoll.value=roll}
  const sz=S.size/100;
  const nk=S.nebula/100;if(nk>.01)for(const n of nebulas)headsFor(n.type).add(_a.copy(camera.position).add(n.pos),n.size,[n.col[0]*nk,n.col[1]*nk,n.col[2]*nk],n.type,n.seed);
  {const now=performance.now()/1000,nSp=Math.min(flares.length,Math.round(S.sparkles));
   for(let i=0;i<nSp;i++){const f=flares[i],k=.62+.38*Math.sin(now*f.w+f.ph);heads.add(_a.copy(camera.position).add(f.d),f.s,[f.col[0]*k,f.col[1]*k,f.col[2]*k],4)}}
  for(const c of creatures)c.render(simT,camera.position,sz*(1+Math.max(0,c.pos.distanceTo(camera.position)-8)/40));
  for(const h of allHeads)h.flush();
  composer.render();
  prevView.copy(camera.matrixWorldInverse);
}
requestAnimationFrame(frame);
if(Q.get('flyf')){Object.assign(S,{spinners:0,meteors:0,worms:0,trailers:0,tubifex:0});rebuildCreatures();
  spawnShip(Q.get('fly')||'tos');const u=ship.userData;const f=+Q.get('flyf');u.t=f*u.life;const sp=u.speed;u.speed=sp;u.frozen=true;}
if(Q.get('only')){const o=Q.get('only');Object.assign(S,{spinners:o==='spinner'?3:0,meteors:0,worms:0,trailers:0,tubifex:o==='tubifex'?16:0});rebuildCreatures();
  const c=creatures[0];if(c){window.__cam={p:c.pos.clone().add(new V3(0,0,9)),l:c.pos.clone()}}}
if(Q.get('pin')){Object.assign(S,{spinners:0,meteors:0,worms:0,trailers:0,tubifex:0});rebuildCreatures();
  pinShip(Q.get('pin'),+(Q.get('az')||0),+(Q.get('el')||.3),+(Q.get('pd')||48));}
window.rl={S,applyEra,rebuildCreatures,creatures:()=>creatures,camera,cam,nebulas,flares,spawnShip,ship:()=>ship,setWorld,shipPass};
</script>
